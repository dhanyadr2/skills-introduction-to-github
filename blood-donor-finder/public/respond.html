<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b3122e">
  <title>Blood request · Blood Donor Finder</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/respond.js"></script>
</head>
<body>
<main class="container">
  <h1>Blood request</h1>
  <div id="message"></div>
  <div id="request" hidden>
    <div class="card">
      <p id="intro" style="margin-top:0"></p>
      <dl class="facts" id="facts"></dl>
    </div>
    <div id="actions" class="card" hidden>
      <p class="small" style="margin-top:0">If you accept, you and the requester will receive each other&#39;s phone and email.
        Only accept if you are healthy and able to donate. Never pay or accept money to donate.</p>
      <div class="row">
        <button type="button" id="accept">I can help — share my contact</button>
        <button type="button" class="secondary" id="decline">I can&#39;t help this time</button>
      </div>
    </div>
    <div id="outcome"></div>
  </div>
</main>
</body>
</html>
